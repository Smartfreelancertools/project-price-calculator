<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Project Price Calculator</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 500px;
  margin: 40px auto;
  background: white;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

h1 {
  text-align: center;
}

p {
  text-align: center;
  color: #666;
}

label {
  display: block;
  margin-top: 20px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  box-sizing: border-box;
  border: 1px solid #ddd;
  border-radius: 8px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 25px;
  border: none;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  font-size: 17px;
  cursor: pointer;
}

#result {
  margin-top: 25px;
  padding: 20px;
  background: #eef4ff;
  border-radius: 10px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
  <h1>Project Price Calculator</h1>

  <p>Calculate your freelance project price easily.</p>

  <label>Hours Needed</label>
  <input type="number" id="hours" placeholder="Example: 10">

  <label>Your Hourly Rate ($)</label>
  <input type="number" id="rate" placeholder="Example: 20">

  <button onclick="calculate()">Calculate Price</button>

  <div id="result">
    Enter details above
  </div>
</div>

<script>
function calculate() {
  let hours = document.getElementById("hours").value;
  let rate = document.getElementById("rate").value;

  let total = hours * rate;

  document.getElementById("result").innerHTML =
  "Recommended Project Price: $" + total;
}
</script>

</body>
</html>
